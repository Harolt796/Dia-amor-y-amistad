<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="musica" loop>
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>

    <div class="instruccion">
        <h1>Nuestro Universo</h1>
        <p>Explora los planetas mientras el ecosistema cobra vida ✨</p>
        <p id="estado-texto" style="color: #00ffff; font-weight: bold; margin-top: 10px;">Sistema estable...</p>
    </div>

    <!-- Actores de la cinemática -->
    <div id="nave" class="actor nave">🚀</div>
    <div id="alien" class="actor alien">👽</div>
    <div id="explosion" class="actor explosion">💥</div>
    <div id="laser" class="actor laser"></div>
    <div id="laser-reparador" class="actor laser-reparador"></div>
    <div class="cometa">☄️</div>

    <div class="universo">
        <div class="planeta" data-img="assets/foto1.jpg" data-titulo="El día que nos conocimos" data-mensaje="Desde ese momento supe que serías alguien muy especial en mi vida." style="top: 20%; left: 20%;"></div>
        <div class="planeta" data-img="assets/foto2.jpg" data-titulo="Nuestra primera aventura" data-mensaje="Reír contigo es mi actividad favorita. Gracias por tantos momentos felices." style="top: 60%; left: 70%;"></div>
        <div class="planeta" data-img="assets/foto3.jpg" data-titulo="Para ti, en este día" data-mensaje="¡Feliz Día de la Amistad y el Amor! Te quiero muchísimo." style="top: 30%; left: 80%;"></div>
        
        <!-- Planeta 4 (El que vive la historia) -->
        <div class="planeta peligro" id="planeta-peligro" style="top: 70%; left: 30%; background: radial-gradient(circle at 30% 30%, #00ff88, #006644);"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-contenido">
            <span class="cerrar">&times;</span>
            <img id="modal-img" src="" alt="Recuerdo">
            <h2 id="modal-titulo"></h2>
            <p id="modal-mensaje"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
