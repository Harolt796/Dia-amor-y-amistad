<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas 🌻</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Capa de Fondo Profundo (Nebulosas y Estrellas) -->
    <div id="fondo-profundo">
        <div class="nebulosa nebulosa-1"></div>
        <div class="nebulosa nebulosa-2"></div>
        <div class="nebulosa nebulosa-3"></div>
        <div id="capa-estrellas"></div>
    </div>

    <!-- Capa de Ambiente (Flores, Cometas, etc.) -->
    <div id="capa-ambiente"></div>

    <!-- Pantalla de Inicio (Menú) -->
    <div id="start-screen">
        <div class="menu-panel">
            <h1>Feliz Día del Amor y la Amistad</h1>
            <div class="flores-decorativas">🌻 ✨ 🌻</div>
            <p>Te regalo este universo entero, lleno de flores amarillas y estrellas, porque alguien tan especial como tú merece algo infinito.</p>
            <button id="btn-explorar">Haz clic para explorar ✨</button>
        </div>
    </div>

    <!-- Sistema Orbital 3D -->
    <div id="sistema-solar">
        <div id="orbita">
            <!-- Los planetas se generan con JavaScript para calcular su posición 3D exacta -->
        </div>
    </div>

    <!-- Ventana de Mensajes -->
    <div id="modal-planeta" class="modal">
        <div class="modal-contenido">
            <span class="cerrar">&times;</span>
            <h2 id="modal-titulo"></h2>
            <p id="modal-mensaje"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
