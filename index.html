<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas 🌻</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. PANTALLA DE INICIO (MENÚ) -->
    <div id="start-screen">
        <div class="menu-panel">
            <h1>Feliz Día del Amor y la Amistad</h1>
            <div class="flores-decorativas">🌻 ✨ 🌻</div>
            <p>Te regalo este universo entero, lleno de flores amarillas y estrellas, porque alguien tan especial como tú merece algo infinito.</p>
            <button id="btn-explorar">Haz clic para explorar ✨</button>
        </div>
    </div>

    <!-- 2. FONDO ESPACIAL (Flores y Naves aleatorias) -->
    <div id="espacio-fondo"></div>

    <!-- 3. SISTEMA ORBITAL (Carrusel 3D) -->
    <div id="sistema-orbital">
        <div id="orbita">
            <!-- Planeta 1 -->
            <div class="planeta" data-id="1" style="transform: rotateY(0deg) translateZ(350px);">
                <div class="atmosfera" style="background: radial-gradient(circle at 30% 30%, #ffcc00, #cc8800);"></div>
            </div>
            <!-- Planeta 2 -->
            <div class="planeta" data-id="2" style="transform: rotateY(90deg) translateZ(350px);">
                <div class="atmosfera" style="background: radial-gradient(circle at 30% 30%, #00ccff, #0055cc);"></div>
            </div>
            <!-- Planeta 3 -->
            <div class="planeta" data-id="3" style="transform: rotateY(180deg) translateZ(350px);">
                <div class="atmosfera" style="background: radial-gradient(circle at 30% 30%, #ff66cc, #990066);"></div>
            </div>
            <!-- Planeta 4 -->
            <div class="planeta" data-id="4" style="transform: rotateY(270deg) translateZ(350px);">
                <div class="atmosfera" style="background: radial-gradient(circle at 30% 30%, #00ff88, #006644);"></div>
            </div>
        </div>
    </div>

    <!-- 4. VENTANA EMERGENTE (Mensajes de Amistad) -->
    <div id="modal-planeta" class="modal">
        <div class="modal-contenido">
            <span class="cerrar">&times;</span>
            <h2 id="modal-titulo"></h2>
            <p id="modal-mensaje"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
