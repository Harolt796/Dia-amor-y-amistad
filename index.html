<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas 🌻</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuente elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Mensaje Central (Fijo en pantalla) -->
    <div id="mensaje-central">
        <h1>Feliz Día del Amor y la Amistad</h1>
        <div class="flores-decorativas">🌻 ✨ 🌻</div>
        <p>Te regalo este universo entero, lleno de flores amarillas y estrellas, porque alguien tan especial como tú merece algo infinito.</p>
        <p class="instruccion">Arrastra para explorar el universo ✨</p>
    </div>

    <!-- El Universo Gigante (Se mueve con el arrastre) -->
    <div id="universo">
        
        <!-- Capa de Nebulosas y Ambiente -->
        <div class="nebulosa nebulosa-1"></div>
        <div class="nebulosa nebulosa-2"></div>
        <div class="nebulosa nebulosa-3"></div>

        <!-- Planetas con Atmósfera -->
        <div class="planeta-detallado planeta-1">
            <div class="anillo"></div>
            <div class="luna"></div>
        </div>
        <div class="planeta-detallado planeta-2">
            <div class="atmosfera"></div>
        </div>
        <div class="planeta-detallado planeta-3">
            <div class="anillo"></div>
        </div>

        <!-- Contenedor para flores, naves y aliens generados por JS -->
        <div id="capa-flores"></div>
        <div id="capa-naves"></div>
        <div id="capa-laseres"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
