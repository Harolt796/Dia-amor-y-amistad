<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión: Nuestro Universo ✨</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuente futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Reproductor de música -->
    <audio id="musica" loop>
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla de Inicio -->
    <div id="start-screen" class="overlay">
        <div class="hud-panel">
            <h1>DEFENSA DEL UNIVERSO</h1>
            <p>Naves enemigas se acercan a nuestros planetas.</p>
            <p>Haz clic en los <span style="color:red">👾 Aliens</span> para destruirlos.</p>
            <button id="btn-iniciar">INICIAR DEFENSA</button>
        </div>
    </div>

    <!-- Pantalla de Victoria (Mensaje Final) -->
    <div id="win-screen" class="overlay hidden">
        <div class="hud-panel win-panel">
            <h1 style="color: #00ff88;">MISIÓN CUMPLIDA</h1>
            <img id="win-img" src="assets/foto1.jpg" alt="Recuerdo">
            <h2 id="win-titulo"></h2>
            <p id="win-mensaje"></p>
            <button id="btn-cerrar-win">Cerrar</button>
        </div>
    </div>

    <!-- HUD (Interfaz de Juego) -->
    <div id="hud" class="hidden">
        <div class="hud-item">VIDA DEL PLANETA: <span id="hp-text">100%</span></div>
        <div class="hud-item">ALIENS DESTRUIDOS: <span id="score-text">0</span></div>
        <div class="hud-item" id="status-text">SISTEMA ESTABLE</div>
    </div>

    <!-- Área de Juego -->
    <div id="game-area">
        <!-- Planeta Central a defender -->
        <div id="planeta-central" class="planeta">
            <div class="vida-bar"><div class="vida-llenado" id="vida-planeta"></div></div>
        </div>
        
        <!-- Capa de Aliens -->
        <div id="capa-aliens"></div>
        
        <!-- Capa de Láseres -->
        <div id="capa-lasers"></div>
        
        <!-- Nave Aliada (Oculta al inicio) -->
        <div id="nave-aliada" class="actor oculto">🚀</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
